# Sightline data model (dev plan §9). All tables are @sealed and PRIVATE (no
# @export). Retention is the explicit purge job (ADR-003) — no `expiration`
# directive. Epoch-ms timestamps are Float (GraphQL Int is 32-bit, Spike C).
# Required fields are non-null (!).
#
# Databases (Harper transactions are per-database; transactionally-coupled tables
# must share one — dev plan §9):
#   sightline_core   — identity / credentials / audit (cold, install-time)
#   sightline_ledger — the operational pipeline (capture → normalize → project →
#                      detect → aggregate) + the durable worker checkpoint, which
#                      commit together, so they share one database.

# ─── sightline_core ──────────────────────────────────────────────────────────

type Shop @table(database: "sightline_core") @sealed {
	shopId: ID! @primaryKey
	status: String! @indexed # active | reauthorization_required | uninstalled
	scopes: String
	installedAt: Float
	uninstalledAt: Float
	lastReconciledAt: Float
	reconciliationState: String
	# The shop's own IANA zone (Admin API `shop.ianaTimezone`), so merchant-facing
	# timestamps render in the store's configured timezone rather than the
	# viewer's. Cached once per install; not PII.
	ianaTimezone: String
}

type ShopCredential @table(database: "sightline_core") @sealed {
	# Encrypted offline-token envelope. Never @export, never returned/logged.
	shopId: ID! @primaryKey
	accessTokenEnc: String
	refreshTokenEnc: String
	keyVersion: Int
	expiresAt: Float
	refreshTokenExpiresAt: Float
	version: Int
	status: String # active | reauthorization_required
}

type AppAuditEvent @table(database: "sightline_core") @sealed {
	# Security / lifecycle actions. No payload / PII.
	id: ID! @primaryKey
	shopId: String! @indexed
	action: String! @indexed
	at: Float! @indexed
	detail: String
}

type DigestSubscription @table(database: "sightline_core") @sealed {
	# One notification address per shop. The ONLY merchant-identifying string this
	# app stores — it is a staff address supplied by the merchant, not customer
	# data, and it is disclosed on the Privacy screen and in the privacy policy.
	# Erased on uninstall and on shop redaction.
	shopId: ID! @primaryKey
	email: String
	cadence: String # daily | weekly
	status: String @indexed # active | paused
	createdAt: Float
	updatedAt: Float
	# Period start of the last digest built for this shop. The build decision keys
	# on this, so a re-run inside the same period is a no-op.
	lastBuiltAt: Float
}

type DigestOutbox @table(database: "sightline_core") @sealed {
	# A durable RECORD of what a period looked like, kept because the ledger
	# purges at seven days and a digest about a purged period is not
	# recomputable after that. It is not the message: no sender exists yet, and
	# when one ships it renders its own body (src/digest.ts's digestText /
	# digestHtml) from freshly-gathered input rather than reading one back from
	# here. Keyed `${shopId}:${periodStart}` so rebuilding a period upserts one
	# row rather than duplicating it.
	#
	# Deliberately NO `bodyText`/`bodyHtml` and NO `email` column. `subject` and
	# the count columns below are derived from the period and its counts only —
	# they name no order and no customer, which is what lets this row outlive
	# the seven-day ledger for 30 days without becoming a second place merchant
	# data can leak from. The address itself lives only on DigestSubscription:
	# the privacy policy and the Notifications screen both tell merchants the
	# address is deleted when they clear it or uninstall, and uninstallShop
	# deletes only DigestSubscriptions — so a copy on every outbox row would
	# have survived that promise until the 30-day purge. A future sender reads
	# the address from the subscription at send time, which is the only moment
	# it is actually needed.
	id: ID! @primaryKey
	shopId: String! @indexed
	cadence: String
	periodStart: Float! @indexed
	periodEnd: Float
	subject: String
	# The headline numbers, kept as columns so an operator can see what a digest
	# said without parsing its body. They are NOT all in the same tense, and the
	# names say which is which, because an operator comparing them against the
	# Overview has nothing else to go on.
	#
	# `ordersAwaiting` is CURRENT-STATE and counts ORDERS: how many of this shop's
	# orders were awaiting fulfillment confirmation at the moment the digest was
	# built (isAwaitingConfirmation, src/orders.ts — the same population as the
	# Overview's awaiting tile). It is deliberately NOT period-scoped, and it is not
	# a count of findings: this column was called `unconfirmed` while it held a
	# findings tally, which collides with GapFinding.status 'unconfirmed' — a
	# different population in a different tense, rendered on the Overview as its own
	# "Unconfirmed" findings tile. One order can carry two findings, so the two
	# numbers legitimately differ and must never be read as the same figure.
	ordersAwaiting: Int
	# The two below ARE scoped to this row's period, [periodStart, periodEnd) — and
	# the first one's name says so, because getSummary's `findings.failedAttempts`
	# counts the same findings with NO time bound (capped only by 7-day retention).
	# Same population, different window, and nothing but the name to tell them apart.
	#
	# It also counts ORDERS, not attempts: DETECTOR_FAILED writes one finding per
	# (order, ruleVersion), so two failed attempts on one order are ONE finding. The
	# rendered copy says "orders with a fulfillment attempt Shopify recorded as
	# unsuccessful" for that reason.
	failedAttemptsInPeriod: Int
	# Reconciliation-sourced changes with no matching webhook, in this period — see
	# gatherDigestInput for why matching is best-effort and uses a one-day margin.
	deliveryGaps: Int
	# Recorder health at build time (current-state, like ordersAwaiting): false means
	# the numbers above may be incomplete, and the rendered digest (src/digest.ts's
	# digestText/digestHtml) says so.
	recorderHealthy: Boolean
	status: String! @indexed # pending | sent | skipped
	createdAt: Float! @indexed # retention key (30 days, not the ledger's 7)
}

# ─── sightline_ledger ────────────────────────────────────────────────────────

type WebhookDelivery @table(database: "sightline_ledger") @sealed {
	# id = `${shopId}:${webhookId}` — idempotency key. Seven-day lifecycle (purge).
	id: ID! @primaryKey
	shopId: String! @indexed
	topic: String
	webhookId: String
	receivedAt: Float! @indexed
	status: String! @indexed # accepted | processed | dead_letter
	attempts: Int
	hmacVerified: Boolean
	payload: String # PII-stripped JSON body, kept until the worker normalizes it (7-day purge)
}

type OperationalEvent @table(database: "sightline_ledger") @sealed {
	# Normalized, append-only business event. No customer PII.
	eventId: ID! @primaryKey
	shopId: String! @indexed
	domain: String! # order | fulfillment | inventory | refund
	topic: String
	resourceId: String @indexed # e.g. order id
	sku: String
	quantity: Int
	fulfillableItemCount: Int # order events: units still requiring fulfillment (from line_items) — drives projection eligibility
	# Merchant-facing order identifier ("#1001"). Level 1 order data, not PII — a
	# merchant cannot act on a bare numeric order id.
	orderName: String
	# Order value at the time payment was observed, and its currency. Money amounts
	# carry no customer identifier.
	totalPrice: Float
	currency: String
	# Fulfillment/inventory location this event happened at (Shopify location id).
	locationId: String
	# Tracking PRESENCE and carrier, never a per-customer shipment lookup: whether
	# the fulfillment carried any tracking number, and which carrier.
	hasTracking: Boolean
	trackingCompany: String
	# Shopify's own shipment progress string (in_transit, label_printed, …).
	shipmentStatus: String
	state: String
	source: String! # webhook | reconciliation
	occurredAt: Float! @indexed
	receivedAt: Float!
}

type OrderProjection @table(database: "sightline_ledger") @sealed {
	# id = `${shopId}:${orderId}` — latest evidence for detector + UI.
	id: ID! @primaryKey
	shopId: String! @indexed
	orderId: String!
	financialStatus: String
	fulfillmentStatus: String
	paidAt: Float @indexed # earliest paid time (latch) — indexed: the worklist sorts/filters by order age
	cancelledAt: Float # earliest cancellation (latch)
	fullyRefundedAt: Float # earliest full-refund (latch)
	fulfilledAt: Float # earliest successful fulfillment (latch)
	requiresFulfillment: Boolean # any line item required shipping (latch) — detector eligibility
	orderName: String # immutable in Shopify, so safe as a first-seen latch
	orderTotal: Float # value latched from the EARLIEST paid event
	currency: String
	fulfillmentFailedAt: Float # earliest fulfillment event with status error|failure (latch)
	hasTracking: Boolean # any fulfillment carried a tracking number (latch, monotonic true)
	trackingCompany: String
	trackingAt: Float # earliest fulfillment observed carrying tracking (latch) — keys trackingCompany
	fulfillableItemCount: Int
	state: String @indexed # unpaid | awaiting | fulfilled | no_fulfillment_expected | cancelled | refunded (derived, src/orders.ts)
	deadline: Float @indexed # RESERVED — not written; the expectation owns the deadline
	# The read window for EVERY order-derived surface: the Overview tiles, the flow
	# lanes and the worklist all bound on `lastEventAt >= now − 7 days`, and the
	# state backfill sweep pages on it. Indexed so the hottest read (getSummary, on
	# every screen load) is a bounded index scan rather than a scan of every
	# projection the shop has ever stored.
	lastEventAt: Float @indexed
	# The rebuild guard (src/ingest/orderRefresh.ts): a rebuild that saw fewer events
	# than `eventCount` read a stale event set and is not written, unless
	# `firstEventAt` is old enough that the purge may have removed some of them.
	# Absent on rows written before the guard, which every rebuild overwrites.
	firstEventAt: Float # earliest receivedAt folded in
	eventCount: Int # order-linked events the row was rebuilt from
	lastSourceVersion: Float
}

type Expectation @table(database: "sightline_ledger") @sealed {
	# id = `${detector}:${orderId}:${ruleVersion}` — deterministic.
	id: ID! @primaryKey
	shopId: String! @indexed
	orderId: String!
	detector: String!
	ruleVersion: Int
	state: String! @indexed # pending | resolved | suppressed | expired
	deadline: Float @indexed
	createdAt: Float
	resolvedAt: Float
}

type GapFinding @table(database: "sightline_ledger") @sealed {
	# id deterministic per (detector, order, ruleVersion).
	id: ID! @primaryKey
	shopId: String! @indexed
	orderId: String!
	detector: String @indexed # fulfillment_confirmation | fulfillment_attempt_failed
	ruleVersion: Int
	status: String! @indexed # pending | unconfirmed | resolved | suppressed
	detectedAt: Float @indexed
	resolvedAt: Float
	evidenceEventIds: [String]
}

type FlowAggregate @table(database: "sightline_ledger") @sealed {
	# id = `${shopId}:${bucket}:${lane}` — bounded time-bucket counts.
	id: ID! @primaryKey
	shopId: String! @indexed
	bucket: Float! @indexed # start-of-bucket epoch ms
	lane: String!
	count: Int
}

type WorkerCheckpoint @table(database: "sightline_ledger") @sealed {
	# id = `${worker}:${partition}` — durable cursor + lease. Commits with the
	# processing it checkpoints, so it lives in the ledger database.
	id: ID! @primaryKey
	cursor: String
	leaseHolder: String
	leaseExpiresAt: Float @indexed
	retryCount: Int
	updatedAt: Float
}

type EventSku @table(database: "sightline_ledger") @sealed {
	# One row per (event, SKU) — the index that makes the SKU filter real. The
	# events table can only hold a scalar sku, and an order has many; filtering by
	# SKU therefore has to page over this table and hydrate events by id.
	#
	# The common event filters are DENORMALIZED here on purpose so a SKU-filtered
	# query is an ordinary keyset page with no post-filtering (which would return
	# short pages and break the "more results" signal). Drift is not a risk: both
	# rows are written from the same event in one place and purged/redacted together.
	id: ID! @primaryKey # `${eventId}:${sku}`
	shopId: String! @indexed
	eventId: String! @indexed
	sku: String! @indexed
	quantity: Int
	domain: String!
	topic: String
	source: String!
	resourceId: String
	occurredAt: Float! @indexed
	receivedAt: Float! @indexed # retention key — matches OperationalEvent's
}

type InventoryItem @table(database: "sightline_ledger") @sealed {
	# Admin API cache: inventory_item_id → SKU/product, so an inventory event is
	# readable instead of an opaque number. Reference data, NOT part of the 7-day
	# ledger — it is erased by shop redaction, not by the retention purge.
	id: ID! @primaryKey # `${shopId}:${inventoryItemId}`
	shopId: String! @indexed
	inventoryItemId: String!
	sku: String
	productTitle: String
	variantTitle: String
	updatedAt: Float
}

type ShopLocation @table(database: "sightline_ledger") @sealed {
	# Admin API cache: location_id → location name. Same lifecycle as InventoryItem.
	id: ID! @primaryKey # `${shopId}:${locationId}`
	shopId: String! @indexed
	locationId: String!
	name: String
	updatedAt: Float
}
