rest: true
graphqlSchema:
  files: './schema.graphql'
jsResource:
  files: './resources.ts'
# The SPA + assets are served by the AppHome resource (resources.ts) so the HTML
# can carry a frame-ancestors CSP for embedding in Shopify Admin.

# Secret material this component REQUIRES, declared so a misconfigured deploy
# fails at component load with a NAMED reason (`missing` / `ungranted` /
# `custody-unavailable`) instead of silently running on a weak fallback. That
# named reason is the whole point: the previous design fell back to a hardcoded
# dev secret and a publicly-derivable AES key, and the only signal was a log line
# nobody read.
#
# All three are provisioned as SCOPED secrets (`set_secret` with
# `grants: ['sightline']`, see scripts/set-secrets.mjs), not `processEnv: true`.
# Scoped values are readable only through the per-component `secrets` accessor:
# they never land in `process.env`, so they are absent from environment dumps,
# child processes, and anything that enumerates the environment. `process.env`
# remains a fallback in code for local dev and CI only.
env:
  # Shopify app secret. Verifies webhook HMACs (shopifyWebhook.ts,
  # complianceWebhook.ts) and embedded session tokens (identity.ts).
  SHOPIFY_API_SECRET: { required: true, description: Shopify app client secret }
  # 32-byte hex. Wraps Shopify offline tokens at rest (secrets/crypto.ts).
  SIGHTLINE_TOKEN_KEY: { required: true, description: AES-256-GCM key for token envelope encryption }
  # Shared secret gating /api/v1/ops (opsResource.ts). >= 32 chars or opsAuth
  # treats it as absent.
  SIGHTLINE_OPS_TOKEN: { required: true, description: Operator token for /api/v1/ops }

# Periodic background work. Harper's scheduler runs each occurrence once, on
# the elected leader; see the "SCHEDULING" comment at the top of jobs.ts.
# Every handler must be idempotent: a failover can deliver an occurrence twice.
scheduler:
  jobs:
    # Processes accepted webhook deliveries: normalize -> ledger -> projection.
    # jobs.ts's PROCESS_BUDGET_MS is sized to this interval; change them together.
    - name: sightline-process
      interval: 10s
      handler: ./jobs.ts#processDeliveriesJob
    # One-time repair of the derived `state` column on projections written before
    # it existed. Short interval so a deploy converges quickly, then it goes
    # quiet — a converged pass reads one small batch and writes nothing.
    - name: sightline-state-backfill
      interval: 1m
      handler: ./jobs.ts#stateBackfillJob
    # Ops-health heartbeat: backlog age/count, dead letters, reconcile staleness,
    # reauth. Emitted at warn when unhealthy so an alert can key off the level.
    - name: sightline-ops-snapshot
      interval: 1m
      handler: ./jobs.ts#opsSnapshotJob
    # Expires pending expectations whose deadline passed with NO new event. The
    # event-driven path in delivery processing already handles transitions.
    - name: sightline-detect
      interval: 5m
      handler: ./jobs.ts#detectJob
    # Admin API reconciliation; first run per shop backfills 7 days.
    - name: sightline-reconcile
      interval: 10m
      handler: ./jobs.ts#reconcileJob
    # Resolves inventory item ids -> product/variant titles and location names.
    - name: sightline-inventory-enrich
      interval: 15m
      handler: ./jobs.ts#inventoryEnrichJob
    # Seven-day ledger purge + the outbox's own thirty-day purge (ADR-003).
    - name: sightline-purge
      interval: 1h
      handler: ./jobs.ts#purgeJob
    # Builds each subscriber's digest for the last COMPLETE period. Hourly tick;
    # shouldBuild() does the real cadence gating, so cadence lives in data.
    - name: sightline-digest
      interval: 1h
      handler: ./jobs.ts#digestJob
