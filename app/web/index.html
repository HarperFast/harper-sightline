<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Capture the native fetch BEFORE App Bridge patches it. App Bridge auto-
		     injects `Authorization: Bearer` on same-origin fetches, which Harper
		     401s before our resource runs; the data client uses this pristine
		     reference with our own X-Shopify-Session-Token instead. -->
		<script>
			window.__sightlineFetch = window.fetch;
		</script>
		<meta name="shopify-api-key" content="e446bda5edb3ee3bae6e0ba280ef8b12" />
		<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
		<!-- Polaris web components — the Admin-native component set. Everything
		     structural (page, section, banner, badge, table, fields, links) comes
		     from here; the only local CSS below is for the activity bars, which
		     Polaris has no equivalent for. -->
		<script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
		<title>Sightline</title>
		<style>
			/* Activity-over-time bars. Magnitude is bar HEIGHT, never colour, and an
			   exact per-day table sits beside them as the text equivalent. Sized in
			   ems and coloured from currentColor so it inherits Polaris typography
			   and theming (including dark mode) rather than hardcoding a palette. */
			.spark {
				display: flex;
				flex-direction: column;
				gap: 0.4em;
			}
			.spark-row {
				display: flex;
				align-items: flex-end;
				gap: 0.75em;
			}
			.spark-label {
				flex: none;
				width: 7em;
				font-size: 0.8125em;
				opacity: 0.7;
			}
			.spark-bars {
				display: flex;
				align-items: flex-end;
				gap: 0.2em;
				height: 1.75em;
				flex: 1 1 auto;
				min-width: 0;
			}
			/* One day's track. The translucency belongs to a PSEUDO-ELEMENT, never to
			   `.bar` itself: `opacity` on an element composites the element AND its
			   descendants as one group, so `opacity: 0.12` here dimmed `.bar-fill` to
			   the exact colour of the track it sits in. Every bar then rendered as an
			   identical flat rectangle whatever its value — a chart that draws its
			   data and hides it. The heights were always correct (view.test.ts pins
			   0% and 100%); only the paint was wrong.
			   Do not move `opacity` back onto `.bar`, and do not give `.bar-fill` an
			   `opacity` either — see the guard in test/activityChart.test.ts. */
			.bar {
				position: relative;
				flex: 1 1 0;
				height: 100%;
				display: flex;
				align-items: flex-end;
				border-radius: 2px;
			}
			.bar::before {
				content: '';
				position: absolute;
				inset: 0;
				background: currentColor;
				opacity: 0.12;
				border-radius: 2px;
			}
			/* Above the track, so a short bar is still legible against it. */
			.bar-fill {
				position: relative;
				width: 100%;
				background: currentColor;
				border-radius: 2px;
			}
			/* The day axis: one tick per bar, in the same flex track as the bars so a
			   tick cannot drift out of line with the bar it labels. */
			.spark-axis {
				display: flex;
				align-items: flex-start;
				gap: 0.75em;
			}
			.spark-ticks {
				display: flex;
				gap: 0.2em;
				flex: 1 1 auto;
				min-width: 0;
			}
			.tick {
				flex: 1 1 0;
				min-width: 0;
				text-align: center;
				font-size: 0.6875em;
				opacity: 0.7;
				overflow: hidden;
				white-space: nowrap;
			}
			.spark-total {
				flex: none;
				width: 3em;
				text-align: right;
				font-variant-numeric: tabular-nums;
				font-size: 0.8125em;
			}
			.alt {
				margin-top: 0.75em;
				font-size: 0.8125em;
			}
			.alt summary {
				cursor: pointer;
			}
			/* The Events screen's filter disclosure. The default view is a list of
			   recent activity; the seven-field search form lives behind this one line
			   and opens itself whenever a filter is actually in force (view.ts
			   eventsView). A native <details> so keyboard operation, the expanded/
			   collapsed state announced to a screen reader, and find-in-page all come
			   from the platform. */
			.filter-disclosure {
				margin: 0.5em 0 0.75em;
			}
			.filter-disclosure > summary {
				cursor: pointer;
				padding: 0.25em 0;
				font-weight: 600;
			}
			.filter-disclosure[open] > summary {
				margin-bottom: 0.75em;
			}
			/* The in-page nav fallback (see index.html comment on s-app-nav). */
			.appnav {
				display: flex;
				flex-wrap: wrap;
				gap: 1em;
				padding: 0.75em 1em 0;
			}
		</style>
	</head>
	<body>
		<!-- Native Admin navigation: these render in Shopify's own app nav, not in
		     the iframe. The first entry configures the home route and is not itself
		     rendered (rel="home").
		     Each href MUST be a real path within the app ("/orders"), never a
		     fragment: that is s-app-nav's documented contract, and it navigates to
		     the path client-side. These were "#/orders", so Admin rendered six links
		     that did nothing when clicked while the identical routes in the in-page
		     nav below worked. The SPA answers to both forms (view.ts parseRoute), so
		     the two navs agree; test/appNav.test.ts pins the href format.
		     NOTE: s-app-nav only renders inside real Admin, and it is not verifiable
		     from local dev — so the in-page nav below is kept as a guaranteed
		     fallback. Once s-app-nav is confirmed working in the live embed, drop
		     `.appnav` and its markup. -->
		<s-app-nav>
			<s-link href="/" rel="home">Sightline</s-link>
			<s-link href="/">Overview</s-link>
			<s-link href="/orders">Orders</s-link>
			<s-link href="/events">Events</s-link>
			<s-link href="/findings">Findings</s-link>
			<s-link href="/notifications">Notifications</s-link>
			<s-link href="/privacy">Privacy</s-link>
		</s-app-nav>
		<nav class="appnav" aria-label="Sightline sections">
			<s-link href="#/" data-nav="/">Overview</s-link>
			<s-link href="#/orders" data-nav="/orders">Orders</s-link>
			<s-link href="#/events" data-nav="/events">Events</s-link>
			<s-link href="#/findings" data-nav="/findings">Findings</s-link>
			<s-link href="#/notifications" data-nav="/notifications">Notifications</s-link>
			<s-link href="#/privacy" data-nav="/privacy">Privacy</s-link>
		</nav>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
