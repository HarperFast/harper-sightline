# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e446bda5edb3ee3bae6e0ba280ef8b12"
name = "Harper Sightline"
application_url = "https://ayoo.josh-test.harperfabric.com"
embedded = true

[access_scopes]
# Minimal read set (docs/shopify-contract.md §2). No write scopes; no read_all_orders.
scopes = "read_orders,read_fulfillments,read_inventory"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://ayoo.josh-test.harperfabric.com/api/v1/auth/callback" ]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/paid", "orders/updated", "orders/cancelled" ]
  uri = "https://ayoo.josh-test.harperfabric.com/webhooks/shopify/events"
  include_fields = [ "id", "admin_graphql_api_id", "name", "order_number", "created_at", "updated_at", "processed_at", "cancelled_at", "closed_at", "confirmed", "financial_status", "fulfillment_status", "currency", "line_items" ]

  [[webhooks.subscriptions]]
  topics = [ "fulfillments/create", "fulfillments/update" ]
  uri = "https://ayoo.josh-test.harperfabric.com/webhooks/shopify/events"
  include_fields = [ "id", "admin_graphql_api_id", "order_id", "status", "shipment_status", "created_at", "updated_at", "tracking_company", "tracking_numbers", "line_items" ]

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "https://ayoo.josh-test.harperfabric.com/webhooks/shopify/events"
  include_fields = [ "inventory_item_id", "location_id", "available", "updated_at" ]

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "https://ayoo.josh-test.harperfabric.com/webhooks/shopify/events"
  include_fields = [ "id", "admin_graphql_api_id", "order_id", "created_at", "processed_at", "refund_line_items", "transactions" ]

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://ayoo.josh-test.harperfabric.com/webhooks/shopify/events"

  [webhooks.privacy_compliance]
  customer_data_request_url = "https://ayoo.josh-test.harperfabric.com/webhooks/shopify/compliance/customers/data_request"
  customer_deletion_url = "https://ayoo.josh-test.harperfabric.com/webhooks/shopify/compliance/customers/redact"
  shop_deletion_url = "https://ayoo.josh-test.harperfabric.com/webhooks/shopify/compliance/shop/redact"
